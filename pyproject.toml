[project]
name = "databridge-analytics-service"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "SQLAlchemy==2.0.40",
  "psycopg[binary]==3.2.9",
  "PyJWT==2.10.1",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
start = "app.main:start"

[tool.setuptools]
packages = ["app"]
